name: Publish Chocolatey Feed

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================
# 1) Mirrors packages.yaml from community.chocolatey.org and packs packages/*.
# 2) Installs them with choco 2.x on Windows from a localhost copy of the feed.
# 3) On main, builds the feed per env (baseURI is baked into every URL) and rsyncs it to choco/ of that env's
#    client feed bucket, through WIF bound to this repo's main branch (openframe-saas-tf 00-wif + 03-shared).

permissions:
  contents: read

on:
  schedule:
    - cron: "23 5 * * *"   # daily; community re-publishes checksum-pinned packages (Chrome) within a day of a vendor release
  workflow_dispatch:
  pull_request:   # no paths filter: All Checks is required on every PR
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages.yaml
      - packages/**
      - scripts/**
      - .github/workflows/publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLEET_VERSION: "7.2.0"
  TEST_PACKAGES: "7zip git vlc googlechrome notepadplusplus firefox"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sync packages from community.chocolatey.org
        run: python3 scripts/sync-community.py

      - name: Pack own packages
        run: python3 scripts/pack-own.py prod

      - name: Render catalog
        run: |
          python3 scripts/render-catalog.py
          cat CATALOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install Sleet
        run: |
          dotnet tool install -g sleet --version "$SLEET_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build test feed
        run: scripts/build-feed.sh feed-test "http://localhost:8080/"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            downloads
            catalog.json
            CATALOG.md
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: feed-test
          path: feed-test
          if-no-files-found: error
          retention-days: 1


  test_install:
    name: Install Test
    needs: build
    runs-on: windows-latest   # ships Chocolatey CLI
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed-test
          path: feed-test

      - name: Serve the feed from localhost
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m", "http.server", "8080", "--bind", "127.0.0.1" -WorkingDirectory feed-test -WindowStyle Hidden
          Start-Sleep 3
          Invoke-WebRequest http://localhost:8080/index.json -UseBasicParsing | Select-Object -ExpandProperty StatusCode

      - name: Require Chocolatey CLI 2.x
        shell: pwsh
        run: |
          $v = (choco --version).Trim()
          Write-Host "choco $v"
          if ([version]$v -lt [version]"2.0.0") { throw "choco $v cannot read a v3 feed" }

      - name: Install from the feed only
        shell: pwsh
        run: |
          choco source disable -n chocolatey
          choco source add -n test -s http://localhost:8080/index.json --priority 1
          foreach ($id in $env:TEST_PACKAGES.Split(" ")) {
            Write-Host "::group::choco install $id"
            choco install $id -s test -y --no-progress
            if ($LASTEXITCODE -notin 0, 3010) { throw "$id failed with exit code $LASTEXITCODE" }
            Write-Host "::endgroup::"
          }
          choco search --source test

      - name: Uninstall
        shell: pwsh
        run: |
          foreach ($id in $env:TEST_PACKAGES.Split(" ")) {
            choco uninstall $id -y --no-progress -x
          }


  publish:
    name: "Publish: ${{ matrix.env }}"
    needs: [build, test_install]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}   # stage/prod providers only accept a token from their own GitHub environment
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            base_uri: https://feed.openframe.build/choco/
            bucket: shared-j62b-client-feed
            provider: projects/492931088817/locations/global/workloadIdentityPools/github/providers/github-oidc
          - env: stage
            base_uri: https://feed.openframe.miami/choco/
            bucket: shared-d8ue-client-feed
            provider: projects/440334309161/locations/global/workloadIdentityPools/github/providers/github-oidc
          - env: prod
            base_uri: https://feed.openframe.ai/choco/
            bucket: shared-4t5d-client-feed
            provider: projects/49201622058/locations/global/workloadIdentityPools/github/providers/github-oidc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Install Sleet
        run: |
          dotnet tool install -g sleet --version "$SLEET_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build feed
        env:
          BASE_URI: ${{ matrix.base_uri }}
          ENV: ${{ matrix.env }}
        run: |
          python3 scripts/pack-own.py "$ENV"
          scripts/build-feed.sh feed "$BASE_URI"
          cp catalog.json feed/   # curated/dependency/own per id; the backend's package search reads it

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ matrix.provider }}

      - uses: google-github-actions/setup-gcloud@v3

      # Checksums, since every rebuilt file has a new mtime; delete drops packages removed from packages.yaml.
      - name: Rsync feed to the bucket
        env:
          BUCKET: ${{ matrix.bucket }}
        run: |
          gcloud storage rsync --recursive --checksums-only --delete-unmatched-destination-objects \
            feed/ "gs://${BUCKET}/choco/"

      - name: Verify the served feed
        env:
          BASE_URI: ${{ matrix.base_uri }}
          ENV: ${{ matrix.env }}
        run: python3 scripts/verify-feed.py "$ENV" "$BASE_URI"


  all-checks:
    name: "All Checks"
    needs: [build, test_install]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'   # required check on the main ruleset
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
