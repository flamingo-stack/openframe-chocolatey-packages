# Sync curated packages from community.chocolatey.org, build the static NuGet v3 feed with Sleet,
# prove it installs with choco 2.x on Windows, then rsync it into the GCS feed bucket.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   FEED_BASE_URI                    https://choco.<env public domain>/ (tf output feed_url minus index.json; baked into the feed)
#   FEED_BUCKET                      github-wif-xxxx-choco-feed         (tf output feed_bucket)
#   GCP_WORKLOAD_IDENTITY_PROVIDER   projects/N/locations/global/workloadIdentityPools/github/providers/github-oidc
#                                                                       (tf output github_workload_identity_provider)
# No secrets: auth is Workload Identity Federation, bound in openframe-saas-tf openframe-saas/dev/shared/03-github-wif to this repo's main branch only.

name: Sync & publish Chocolatey feed

on:
  schedule:
    - cron: "17 5 * * *" # daily; community re-publishes checksum-pinned packages (Chrome) within a day of a vendor release
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages.yaml
      - packages/**
      - overrides/**
      - scripts/**
      - .github/workflows/publish.yml

concurrency:
  group: feed # one publish at a time; a parallel rsync would interleave two feeds
  cancel-in-progress: false

env:
  TEST_PACKAGES: 7zip googlechrome notepadplusplus firefox

jobs:
  build:
    name: Sync from community & build feed
    runs-on: ubuntu-latest
    outputs:
      package_count: ${{ steps.summary.outputs.package_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync curated packages + dependency closure from community.chocolatey.org
        run: python3 scripts/sync-community.py

      - name: Pack own packages (packages/*) — no choco on Linux, the .nupkg is built as an OPC zip
        run: python3 scripts/pack-own.py

      - name: Render catalog
        run: python3 scripts/render-catalog.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Sleet
        run: |
          dotnet tool install -g sleet
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build feed for the public feed URL (what goes to the bucket)
        run: scripts/build-feed.sh feed "${{ vars.FEED_BASE_URI }}"

      - name: Build feed for the Windows install test (served from localhost on the runner)
        run: scripts/build-feed.sh feed-test "http://localhost:8080/"

      - name: Summary
        id: summary
        run: |
          count=$(python3 -c "import json;print(len(json.load(open('catalog.json'))['packages']))")
          echo "package_count=$count" >> "$GITHUB_OUTPUT"
          { echo "## Feed: $count packages, $(du -sh feed | cut -f1)"; echo; sed -n '1,40p' docs/CATALOG.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: feed
          path: feed
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: feed-test
          path: feed-test
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            catalog.json
            docs/CATALOG.md
          retention-days: 30

  test-install:
    name: choco 2.x install test (Windows)
    needs: build
    runs-on: windows-latest # ships Chocolatey CLI preinstalled
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feed-test
          path: feed-test

      - name: Serve the feed from localhost
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m", "http.server", "8080", "--bind", "127.0.0.1" -WorkingDirectory feed-test -WindowStyle Hidden
          Start-Sleep 3
          Invoke-WebRequest http://localhost:8080/index.json -UseBasicParsing | Select-Object -ExpandProperty StatusCode

      - name: Require Chocolatey CLI 2.x (NuGet v3)
        shell: pwsh
        run: |
          $v = (choco --version).Trim()
          Write-Host "choco $v"
          if ([version]$v -lt [version]"2.0.0") { throw "choco $v cannot read a v3 feed" }

      - name: Install from our feed only
        shell: pwsh
        run: |
          choco source disable -n chocolatey
          choco source add -n test -s http://localhost:8080/index.json --priority 1
          foreach ($id in "${{ env.TEST_PACKAGES }}".Split(" ")) {
            Write-Host "::group::choco install $id"
            choco install $id -s test -y --no-progress
            if ($LASTEXITCODE -notin 0, 3010) { throw "$id failed with exit code $LASTEXITCODE" }
            Write-Host "::endgroup::"
          }
          choco list --source test

      - name: Uninstall (proves the uninstall scripts too)
        shell: pwsh
        run: |
          foreach ($id in "${{ env.TEST_PACKAGES }}".Split(" ")) {
            choco uninstall $id -y --no-progress -x
          }

  publish:
    name: Publish to GCS
    needs: [build, test-install]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit catalog.json + docs/CATALOG.md back as the audit trail
      id-token: write   # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: feed
      - uses: actions/download-artifact@v4
        with:
          name: catalog

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # no service_account: the principalSet is bound to the bucket directly

      - uses: google-github-actions/setup-gcloud@v2

      - name: rsync feed into the bucket
        # Two passes so Cloud CDN (USE_ORIGIN_HEADERS) gets the right Cache-Control per file class:
        #   metadata JSON changes on every publish → max-age=60; *.nupkg names carry the version → immutable for a year.
        # -c compares checksums, otherwise every regenerated .nupkg (new mtime, same bytes) is re-uploaded daily
        # -d removes objects for packages dropped from packages.yaml (no versioning on the bucket; the next run is the rollback)
        # -x excludes from both sides, so each pass leaves the other class's objects alone
        run: |
          gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" \
            rsync -r -c -d -x '^(?!.*\.nupkg$).*' feed/ "gs://${{ vars.FEED_BUCKET }}/"
          gsutil -m -h "Cache-Control:public, max-age=60" \
            rsync -r -c -d -x '.*\.nupkg$' feed/ "gs://${{ vars.FEED_BUCKET }}/"

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json docs/CATALOG.md
          git diff --cached --quiet || git commit -m "chore(feed): publish ${{ needs.build.outputs.package_count }} packages [skip ci]"
          git push
